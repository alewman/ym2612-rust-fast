[package]
name = "ym2612-wasm-check"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs rungs 1 and 2 inside WebAssembly, and a speed figure (scripts/wasm-check.sh)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ym2612-rust-fast = { path = ".." }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"

# Not a member of the parent's workspace: built only for wasm32.
[workspace]
