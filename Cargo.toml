[package]
name = "ym2612-rust-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast fork of ym2612-rust, the YM2612 / YM3438 (OPN2) core, kept equivalent to ym2612-python on every cycle"
license = "MIT"
repository = "https://github.com/alewman/ym2612-rust-fast"
publish = false

[lib]
name = "ym2612_rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
codegen-units = 1
lto = "fat"
